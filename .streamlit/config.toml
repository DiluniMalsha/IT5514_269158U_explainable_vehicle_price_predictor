# Light theme using the same palette as the report figures (code/figstyle.py),
# so a chart drawn by the app and the same chart in the report do not sit on
# different backgrounds. Streamlit otherwise follows the operating system, which
# would put light matplotlib figures on a dark page.
#
# Streamlit reads this from the working directory, so run the app from the
# assignment folder:  streamlit run app/app.py

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "serif"

[browser]
gatherUsageStats = false
